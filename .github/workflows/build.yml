name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Source archive
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=zip -o "dist/IR-Recorder-Source-${VERSION}.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ir-recorder-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: IR Recorder ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/IR-Recorder-Setup-*.exe
            dist/IR-Recorder-Portable-*.exe
            dist/IR-Recorder-Source-*.zip

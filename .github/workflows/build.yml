name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Source archive
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git archive --format=zip -o "dist/IR-Recorder-Source-${VERSION}.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ir-recorder-windows
          path: |
            dist/*.exe
            dist/*.zip

      # Creates (or refreshes) the release for the version in package.json.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: IR Recorder ${{ steps.meta.outputs.version }}
          make_latest: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/IR-Recorder-Setup-*.exe
            dist/IR-Recorder-Portable-*.exe
            dist/IR-Recorder-Source-*.zip

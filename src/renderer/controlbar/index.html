<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
	<title>IR Recorder Control</title>
	<link rel="stylesheet" href="../shared/kasbo-base.css">
	<link rel="stylesheet" href="controlbar.css">
</head>
<body>
	<div id="kasbo-cbar" class="kasbo-cbar">
		<div class="kasbo-cbar__grip" title="جابه‌جایی">
			<svg class="kasbo-icon" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>
		</div>
		<div class="kasbo-cbar__time">
			<span class="kasbo-cbar__dot"></span>
			<span id="kasbo-time">00:00</span>
		</div>
		<span class="kasbo-cbar__sep"></span>
		<button type="button" class="kasbo-cbtn" data-action="pause" title="توقف موقت (Alt+Shift+P)">
			<svg class="kasbo-icon kasbo-icon--pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
			<svg class="kasbo-icon kasbo-icon--play" viewBox="0 0 24 24"><path d="M7 5v14l11-7Z"/></svg>
		</button>
		<button type="button" class="kasbo-cbtn" data-action="mic" title="قطع/وصل میکروفون (Alt+Shift+M)">
			<svg class="kasbo-icon kasbo-icon--mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
			<svg class="kasbo-icon kasbo-icon--mic-off" viewBox="0 0 24 24"><path d="m3 3 18 18"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V6a3 3 0 0 0-5.7-1.3"/><path d="M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 10.4 6.1"/><path d="M12 18v3"/></svg>
		</button>
		<button type="button" class="kasbo-cbtn" data-action="zoom" title="زوم خودکار (Alt+Shift+Z)">
			<svg class="kasbo-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
		</button>
		<button type="button" class="kasbo-cbtn" data-action="follow" title="کادر دنبال ماوس (Alt+Shift+F)">
			<svg class="kasbo-icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M3 12h2M19 12h2"/><path d="m4 10-2 2 2 2M20 10l2 2-2 2"/></svg>
		</button>
		<button type="button" class="kasbo-cbtn" data-action="draw" title="طراحی روی صفحه (Alt+Shift+D)">
			<svg class="kasbo-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
		</button>
		<button type="button" class="kasbo-cbtn kasbo-cbtn--stop" data-action="stop" title="پایان ضبط (Alt+Shift+R)">
			<svg class="kasbo-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
		</button>
	</div>
	<script src="controlbar.js"></script>
</body>
</html>
